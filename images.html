<!DOCTYPE html>
<html lang="cs">
    <head>
        <title>Google Obrázky</title>
        <link href="style.css" type="text/css" rel="stylesheet">
    </head>
    <body>
        <nav>
            <a href="index.html">Zpět na Google</a>
        </nav>

        <div class="hlavni">
            <h1>Google Obrázky</h1>

            <form action="https://www.google.com/search">
                <input type="text" name="q" class="hledani">
                <input type="hidden" name="tbm" value="isch">

                <div class="tlacitka">
                    <input type="submit" value="Hledat obrázky">
                </div>
            </form>
        </div>
    </body>
</html>
