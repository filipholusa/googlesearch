<!DOCTYPE html>
<html lang="cs">
    <head>
        <title>Rozšířené vyhledávání</title>
        <link href="style.css" rel="stylesheet">
    </head>
    <body>
        <nav>
            <a href="index.html">Zpět na hlavní stránku</a>
            <a href="https://filipholusa.github.io/" class="portfolio">Moje portfolio</a>
        </nav>

        <div class="advanced">
            <h1>Rozšířené vyhledávání</h1>
            <p>Upřesni, co chceš najít.</p>

            <form action="https://www.google.com/search">
                <div class="radek">
                    <label>Všechna slova:</label>
                    <input type="text" name="as_q" placeholder="Moderní stavby">
                </div>
                <div class="radek">
                    <label>Přesná fráze:</label>
                    <input type="text" name="as_epq" placeholder="nejlepší hry">
                </div>
                <div class="radek">
                    <label>Některá slova:</label>
                    <input type="text" name="as_oq" placeholder="pes kočka">
                </div>
                <div class="radek">
                    <label>Vynechat slova:</label>
                    <input type="text" name="as_eq" placeholder="reklama">
                </div>
                <input type="submit" value="Vyhledat" class="zelene">
            </form>
        </div>

        <footer>Školní projekt</footer>
    </body>
</html>
